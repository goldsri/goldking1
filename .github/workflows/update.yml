name: M3U Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Playlist
        env:
          SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
        run: |
          curl -fL "$SOURCE_M3U_URL" -o playlist.m3u

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Auto update playlist"
          git push
